[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mosaicfeed"
version = "0.15.0"
description = "An explainable, diversity-aware feed ranking and evaluation laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Weiping Yan" }]
keywords = ["recommender-systems", "feed-ranking", "diversity", "offline-evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "hatchling>=1.27",
]

[project.scripts]
mosaicfeed = "mosaicfeed.cli:main"

[project.urls]
Homepage = "https://github.com/appleweiping/MosaicFeed"
Repository = "https://github.com/appleweiping/MosaicFeed"
Issues = "https://github.com/appleweiping/MosaicFeed/issues"

[tool.hatch.build]
exclude = [
  "/.agent",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/.verify-*",
  "/build",
  "/dist",
  "**/__pycache__",
  "**/*.py[cod]",
]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mosaicfeed"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mosaicfeed"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/mosaicfeed/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.bandit]
targets = ["src"]
# B311: MosaicFeed seeds `random.Random(seed)` deliberately so bootstrap confidence
# intervals, holdout sampling and the synthetic-catalog simulation are reproducible.
# These call sites are deterministic research sampling/exploration, not token or
# credential generation; `secrets` would break reproducible evaluations.
skips = ["B311"]
