name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src
      - run: uv run --locked bandit -q -c pyproject.toml -r src
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv audit --locked
      - run: uv run --locked pytest --cov=mosaicfeed --cov-branch --cov-report=term-missing
      - run: uv run --locked python scripts/verify_branch_coverage.py
      - if: matrix.python-version == '3.11'
        run: >-
          uv run --locked mosaicfeed benchmark --articles examples/articles.json
          --events examples/events.json --as-of 2026-08-30T12:00:00Z
          --k 3 --bootstrap-samples 20 --output benchmark-smoke.json
      - if: matrix.python-version == '3.11'
        run: >-
          uv run --locked mosaicfeed run-ablation --articles examples/articles.json
          --events examples/events.json --plan examples/ablation-plan.json
          --registry ablation-smoke
      - if: matrix.python-version == '3.11'
        run: >-
          uv run --locked mosaicfeed run-training-experiment
          --articles examples/training_experiment_articles.json
          --train examples/training_experiment_train.json
          --validation examples/training_experiment_validation.json
          --plan examples/training_experiment_plan.json
          --registry training-experiment-smoke
      - if: matrix.python-version == '3.11'
        name: Run bounded neural-news train/dev smoke test
        shell: bash
        run: |
          uv run --locked mosaicfeed run-neural-news \
            --articles examples/training_experiment_articles.json \
            --train examples/neural_news_train.json \
            --validation examples/neural_news_validation.json \
            --cutoff 2026-01-04T00:00:00Z --dimension 4 --epochs 2 \
            --output neural-news-smoke.json
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("neural-news-smoke.json").read_text(encoding="utf-8"))
          assert result["format"] == "mosaicfeed.neural-news-experiment"
          assert result["model"]["format"] == "mosaicfeed.neural-news"
          assert result["metrics"]["impressions"] == 2
          assert len(result["scores"]) == 4
          assert result["model"]["training_history_lengths"]["train-3"] == 2
          PY
      - if: matrix.python-version == '3.11'
        name: Run bounded neural-news selection smoke test
        shell: bash
        run: |
          uv run --locked mosaicfeed run-neural-news-selection \
            --articles examples/training_experiment_articles.json \
            --train examples/neural_news_train.json \
            --validation examples/neural_news_validation.json \
            --plan examples/neural_news_selection_plan.json \
            --registry neural-selection-smoke
          uv run --locked python - <<'PY'
          from pathlib import Path
          from mosaicfeed.neural_news_selection import (
              read_selected_neural_checkpoint, verify_neural_selection_record,
          )
          root = Path("examples")
          record, = Path("neural-selection-smoke").glob("*.json")
          assert read_selected_neural_checkpoint(record).config.dimension == 2
          assert verify_neural_selection_record(
              record,
              (root / "training_experiment_articles.json").read_bytes(),
              (root / "neural_news_train.json").read_bytes(),
              (root / "neural_news_validation.json").read_bytes(),
              (root / "neural_news_selection_plan.json").read_bytes(),
          )
          PY
      - if: matrix.python-version == '3.11'
        run: >-
          uv run --locked mosaicfeed audit-cohorts --articles examples/articles.json
          --events examples/events.json --cohorts examples/cohorts.json
          --as-of 2026-08-30T12:00:00Z --k 3 --minimum-group-size 1
          --bootstrap-samples 20 --output cohort-audit-smoke.json
      - if: matrix.python-version == '3.11'
        run: >-
          uv run --locked mosaicfeed evaluate-mind --impressions examples/mind_impressions.json
          --scores examples/mind_scores.json --cutoff 1 --cutoff 2
          --output mind-evaluation-smoke.json
      - if: matrix.python-version == '3.11'
        name: Run strict MIND text export/evaluation smoke test
        shell: bash
        run: |
          uv run --locked mosaicfeed export-mind-predictions \
            --impressions examples/mind_impressions.json \
            --scores examples/mind_scores.json \
            --truth examples/mind_truth.txt --output mind-prediction-smoke.txt
          uv run --locked mosaicfeed evaluate-mind-submission \
            --truth examples/mind_truth.txt --prediction mind-prediction-smoke.txt \
            --output mind-submission-smoke.json
          uv run --locked python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          truth = Path("examples/mind_truth.txt").read_bytes()
          prediction = Path("mind-prediction-smoke.txt").read_bytes()
          report = json.loads(Path("mind-submission-smoke.json").read_bytes())
          assert prediction == b"synthetic-1 [2,1]\n"
          assert (report["auc"], report["mrr"], report["ndcg_5"], report["ndcg_10"]) == (1.0,) * 4
          assert report["truth_sha256"] == hashlib.sha256(truth).hexdigest()
          assert report["prediction_sha256"] == hashlib.sha256(prediction).hexdigest()
          PY
      - if: matrix.python-version == '3.11'
        name: Run learned click-model smoke test
        shell: bash
        run: |
          uv run --locked mosaicfeed train-click-model \
            --articles examples/articles.json --events examples/events.json \
            --as-of 2026-08-30T12:00:00Z --epochs 3 --output click-model-smoke.json
          uv run --locked mosaicfeed rank-click-model \
            --model click-model-smoke.json --articles examples/articles.json \
            --events examples/events.json --user alex \
            --as-of 2026-08-30T12:00:00Z --k 3 --output click-ranking-smoke.json
          uv run --locked mosaicfeed train-click-model \
            --articles examples/articles.json --events examples/text-events.json \
            --as-of 2026-08-30T12:00:00Z --epochs 3 --text-features \
            --text-vocabulary-articles examples/text-vocabulary-articles.json \
            --output click-text-model-smoke.json
          uv run --locked mosaicfeed rank-click-model \
            --model click-text-model-smoke.json --articles examples/articles.json \
            --events examples/text-events.json --user alex \
            --as-of 2026-08-30T12:00:00Z --k 3 --output click-text-ranking-smoke.json
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path('click-model-smoke.json').read_text(encoding='utf-8'))
          text = json.loads(Path('click-text-model-smoke.json').read_text(encoding='utf-8'))
          ranking = json.loads(Path('click-text-ranking-smoke.json').read_text(encoding='utf-8'))
          assert legacy['schema_version'] == 1 and 'text_encoder' not in legacy
          assert text['schema_version'] == 2 and 'text_affinity' in text['feature_names']
          assert text['text_encoder']['source_kind'] == 'declared-training-snapshot'
          assert len(set(text['text_encoder']['inverse_document_frequency'])) > 1
          assert text['weights'][-1] != 0
          assert ranking['predictions']
          PY
          uv run --locked mosaicfeed serve-click-model --help
      - if: matrix.python-version == '3.11'
        name: Run incremental event-stream smoke test
        shell: bash
        run: |
          uv run --locked mosaicfeed stream-ingest \
            --articles examples/articles.json --input examples/interaction-events.jsonl \
            --log interaction-smoke.jsonl --checkpoint profile-smoke.checkpoint.json
          uv run --locked mosaicfeed stream-replay \
            --articles examples/articles.json --log interaction-smoke.jsonl \
            --checkpoint profile-smoke.checkpoint.json --as-of 2026-08-30T12:00:00Z \
            --output profile-replay-smoke.json --events-output frozen-history-smoke.json
          uv run --locked mosaicfeed stream-checkpoint \
            --articles examples/articles.json --log interaction-smoke.jsonl \
            --checkpoint profile-smoke.checkpoint.json \
            --output profile-smoke-next.checkpoint.json
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path

          replay = json.loads(Path("profile-replay-smoke.json").read_text(encoding="utf-8"))
          history = json.loads(Path("frozen-history-smoke.json").read_text(encoding="utf-8"))
          assert replay["object"] == "mosaicfeed.profile_replay"
          assert replay["history_snapshot"]["event_count"] == 3
          assert [profile["user_id"] for profile in replay["profiles"]] == ["alex", "rin"]
          assert len(history) == 3
          assert {event.get("weight", 1.0) for event in history} == {1.0, 1.5}
          assert Path("profile-smoke-next.checkpoint.json").stat().st_size > 0
          PY
      - run: uv run --locked python -m build --no-isolation
      - name: Verify bounded distribution contents
        run: uv run --locked python scripts/verify_distributions.py
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        name: Verify the wheel in a clean environment
        shell: bash
        run: |
          python -m venv .ci-wheel-check
          .ci-wheel-check/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          .ci-wheel-check/bin/python -c "import mosaicfeed; print(mosaicfeed.__version__)"
          .ci-wheel-check/bin/mosaicfeed --help
          .ci-wheel-check/bin/mosaicfeed serve-click-model --help
          .ci-wheel-check/bin/mosaicfeed stream-replay --help
          .ci-wheel-check/bin/mosaicfeed train-pairwise-model --help
          .ci-wheel-check/bin/mosaicfeed train-listwise-model --help
          .ci-wheel-check/bin/mosaicfeed run-neural-news --help
          .ci-wheel-check/bin/mosaicfeed run-neural-news-selection --help
          .ci-wheel-check/bin/mosaicfeed export-mind-predictions --help
          .ci-wheel-check/bin/mosaicfeed evaluate-mind-submission --help
          .ci-wheel-check/bin/python -c "from mosaicfeed import PairwiseImpressionRanker; assert PairwiseImpressionRanker(epochs=1).is_fitted is False"
          .ci-wheel-check/bin/python -c "from mosaicfeed import ListwiseImpressionRanker; assert ListwiseImpressionRanker(epochs=1).is_fitted is False"
          .ci-wheel-check/bin/python -c "from mosaicfeed import NeuralNewsConfig; assert NeuralNewsConfig().dimension == 8"
          .ci-wheel-check/bin/mosaicfeed train-click-model \
            --articles examples/articles.json --events examples/text-events.json \
            --as-of 2026-08-30T12:00:00Z --epochs 3 --text-features \
            --text-vocabulary-articles examples/text-vocabulary-articles.json \
            --output click-text-wheel-smoke.json
          .ci-wheel-check/bin/mosaicfeed rank-click-model \
            --model click-text-wheel-smoke.json --articles examples/articles.json \
            --events examples/text-events.json --user alex \
            --as-of 2026-08-30T12:00:00Z --k 3 \
            --output click-text-wheel-ranking-smoke.json
          .ci-wheel-check/bin/python -c "import json; from pathlib import Path; assert json.loads(Path('click-text-wheel-smoke.json').read_text())['schema_version'] == 2; assert len(json.loads(Path('click-text-wheel-ranking-smoke.json').read_text())['predictions']) == 3"
