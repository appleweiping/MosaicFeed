name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=mosaicfeed --cov-branch --cov-report=term-missing
      - if: matrix.python-version == '3.11'
        run: >-
          mosaicfeed benchmark --articles examples/articles.json
          --events examples/events.json --as-of 2026-08-30T12:00:00Z
          --k 3 --bootstrap-samples 20 --output benchmark-smoke.json
      - run: python -m build
