name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-release:
    if: github.repository == 'appleweiping/MosaicFeed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --locked --extra dev
      - name: Run static quality and security gates
        shell: bash
        run: |
          uv run --locked python -m compileall -q src tests examples
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy src
          uv run --locked bandit -q -c pyproject.toml -r src
          uv audit --locked
      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(uv run --locked python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Run release tests
        run: uv run --locked pytest --cov=mosaicfeed --cov-branch --cov-report=term-missing
      - name: Build distributions
        run: uv run --locked python -m build --no-isolation
      - name: Verify the wheel in a clean environment
        shell: bash
        run: |
          python -m venv .release-wheel-check
          .release-wheel-check/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          .release-wheel-check/bin/python -c "import mosaicfeed; assert mosaicfeed.__version__ == '${GITHUB_REF_NAME#v}'"
          .release-wheel-check/bin/mosaicfeed --version
      - name: Verify the source distribution in a clean environment
        shell: bash
        run: |
          python -m venv .release-sdist-check
          .release-sdist-check/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.tar.gz
          .release-sdist-check/bin/python -c "import mosaicfeed; assert mosaicfeed.__version__ == '${GITHUB_REF_NAME#v}'"
          .release-sdist-check/bin/mosaicfeed --version
      - name: Generate runtime dependency SBOM
        shell: bash
        run: >-
          uv export --locked --no-dev --format cyclonedx1.5
          --output-file "dist/mosaicfeed-${GITHUB_REF_NAME#v}.cdx.json"
      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort) > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mosaicfeed-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag --generate-notes
          --title "MosaicFeed ${GITHUB_REF_NAME#v}"
